services:
  app:
    container_name: ama_app
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: ama-prod:latest
    working_dir: /var/www
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/storage          # PERZISTENTNÍ uploads z Filamentu
      - database_data:/var/www/database        # PERZISTENTNÍ SQLite DB
      - .env.production:/var/www/.env:ro
    expose:
      - "9000"
    networks:
      - ama
    restart: unless-stopped
    command: >
      sh -c "php artisan storage:link &&
             php artisan optimize:clear &&
             php-fpm -F"

  nginx:
    image: nginx:1.25-alpine
    container_name: ama_nginx
    depends_on:
      - app
    volumes:
      - .docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/public:ro          # Nově buildnutý public/ z app containeru
      - storage_data:/var/www/storage:ro       # PERZISTENTNÍ storage pro /storage/... requesty
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ama.rule=Host(`amatelier.cz`) || Host(`www.amatelier.cz`)"
      - "traefik.http.routers.ama.entrypoints=websecure"
      - "traefik.http.routers.ama.tls.certresolver=cloudflare"
      - "traefik.http.services.ama.loadbalancer.server.port=80"
      - "traefik.http.routers.ama-http.rule=Host(`amatelier.cz`) || Host(`www.amatelier.cz`)"
      - "traefik.http.routers.ama-http.entrypoints=web"
      - "traefik.http.routers.ama-http.middlewares=ama-redirect-to-https"
      - "traefik.http.middlewares.ama-redirect-to-https.redirectscheme.scheme=https"
    networks:
      - traefik
      - ama
    restart: unless-stopped

volumes:
  storage_data:      # PERZISTENTNÍ - uploads z Filamentu
  database_data:     # PERZISTENTNÍ - SQLite
  app_public:        # NEPERZISTENTNÍ - přepisuje se při každém buildu

networks:
  traefik:
    external: true
  ama:
    external: true