version: "3.9"

services:
  app:
    container_name: ama_app
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: ama-prod:latest
    working_dir: /var/www
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.production
    volumes:
      - ./public:/var/www/public
      - storage_data:/var/www/storage
      - database_data:/var/www/database
      - .env.production:/var/www/.env:ro
    tmpfs:
      - /tmp:noexec,nosuid,nodev,mode=1777
    expose:
      - "9000"
    networks:
      - ama
      - soccky_web
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php-fpm", "-F", "-R"]

  nginx:
    image: nginx:1.25-alpine
    container_name: ama_nginx
    depends_on:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/storage:ro
    tmpfs:
      - /var/cache/nginx:mode=777
      - /var/run:mode=777
      - /tmp:noexec,nosuid,nodev,mode=1777
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ama.rule=Host(`amatelier.cz`) || Host(`www.amatelier.cz`)"
      - "traefik.http.routers.ama.entrypoints=websecure"
      - "traefik.http.routers.ama.tls=true"
      - "traefik.http.routers.ama.tls.certresolver=cloudflare"
      - "traefik.http.routers.ama.middlewares=cloudflare-only@file,security-headers@file"
      - "traefik.http.services.ama.loadbalancer.server.port=80"
    networks:
      - soccky_web
      - ama
    restart: unless-stopped

volumes:
  storage_data:
  database_data:

networks:
  soccky_web:
    name: soccky_web
    external: true
  ama:
    external: true
