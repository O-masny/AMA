worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    server {
        listen 80;
        server_name amatelier.cz www.amatelier.cz;

        root /var/www/public;
        index index.php index.html;

        client_max_body_size 50M;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=()" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location ^~ /build/ {
            alias /var/www/public/build/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;

            if ($uri ~* \.js$) {
                add_header Content-Type "application/javascript; charset=utf-8";
            }
            if ($uri ~* \.css$) {
                add_header Content-Type "text/css; charset=utf-8";
            }
        }

        location ^~ /livewire {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(eot|ttf|woff|woff2)$ {
            add_header Access-Control-Allow-Origin *;
            expires 30d;
        }

        location /storage/ {
            try_files $uri =404;
            access_log off;
            expires 30d;
        }

        location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot|mp4|webm|webp)$ {
            try_files $uri =404;
            expires 30d;
            access_log off;
            log_not_found off;
        }

        location / {
            limit_req zone=one burst=20 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass ama_app:9000;
            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 60s;
        }

        location ~ /\.(env|git|svn|htaccess|htpasswd) {
            deny all;
            access_log off;
            log_not_found off;
        }

        access_log /var/log/nginx/amatelier.access.log;
        error_log /var/log/nginx/amatelier.error.log warn;
    }
}