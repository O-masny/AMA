server {
    listen 80;
    server_name ama.cz www.amatelier.cz;

    root /var/www/public;
    index index.php index.html;

    # Reálná IP klienta z Traefiku
    set_real_ip_from 127.0.0.1; # Traefik container / host
    real_ip_header X-Forwarded-For;

    client_max_body_size 50M;
    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Vite / Filament build assets
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        if ($uri ~* \.js$) {
            add_header Content-Type "application/javascript; charset=utf-8";
        }
        if ($uri ~* \.css$) {
            add_header Content-Type "text/css; charset=utf-8";
        }
    }

    # Storage / uploads
    location /storage/ {
        alias /var/www/public/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Static files caching
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|jpg|jpeg|png|gif|webp)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

     location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass ama_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        
        # Přidejte tyto řádky pro HTTPS detekci
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    access_log /var/log/nginx/amatelier.access.log;
    error_log /var/log/nginx/amatelier.error.log warn;
}
